:root[data-theme="light"]{

[hidden]{display:none!important}

// Pure functions: the data, the tree grown one best split at a time by entropy,
// its predictions, accuracy, the ROC curve and its area. No DOM. verify-trees-app.py
// runs this block in node and compares it with scikit-learn.
const FEAT_KEYS=['pres_margin_prev','seat_margin_prev','inc_party_D','inc_running','pres_party_D','midterm','income_prev','unemp_sep','pop_growth10','pct65_prev','pct_white_prev'];
const FEAT_NAME=['Presidential margin at the last election','Margin at the last race for this seat','A Democrat holds the seat','The incumbent is on the ballot','The president is a Democrat','Midterm year',
  'Median household income, the year before','Unemployment rate in September','Population growth over ten years','Share aged 65 and over','Share white, not Hispanic'];
const FEAT_SHORT=['pres. margin','seat margin','D holds seat','incumbent runs','D president','midterm','income','unemployment','pop. growth','age 65+','white non-Hisp.'];
const FEAT_BINARY=[false,false,true,true,true,true,false,false,false,false,false];
// How a value of each feature is written: margins as D +7.3 or R +7.3, money in thousands, the rest in percent.
const FEAT_KIND=['margin','margin','yes','yes','yes','yes','money','pct','pct','pct','pct'];
function fmtFeat(f,v){const k=FEAT_KIND[f];if(k==='yes')return v?'yes':'no';if(k==='margin')return (v>=0?'D +':'R +')+Math.abs(v).toFixed(1);
  if(k==='money')return '$'+Math.round(v)+'k';return v.toFixed(1)+'%';}
// Entropy of a side with k positives among n, in bits, times n. The split score of the tree.
function entOf(k,n){if(!n||k===0||k===n)return 0;const p=k/n;return -n*(p*Math.log2(p)+(1-p)*Math.log2(1-p));}
function parseRows(raw){return raw.map(r=>({year:r[0],state:r[1],inc:r[2],x:r.slice(3,r.length-1),y:r[r.length-1]}));}
function rssOf(n1,n){return n?n1-n1*n1/n:0;}
// The best split of the points idx over the features feats, both sides at least minLeaf.
// Ties go to the smaller feature index, then the smaller threshold. Pure leaves return null.
function bestSplit(rows,idx,feats,minLeaf){
  const n=idx.length;let n1=0;for(const i of idx)n1+=rows[i].y;
  if(n1===0||n1===n)return null;
  const parent=entOf(n1,n);let best=null;
  for(const f of feats){
    const order=idx.slice().sort((a,b)=>rows[a].x[f]-rows[b].x[f]);
    let l1=0;
    for(let c=1;c<n;c++){
      l1+=rows[order[c-1]].y;
      if(c<minLeaf||n-c<minLeaf)continue;
      const a=rows[order[c-1]].x[f],b=rows[order[c]].x[f];
      if(a===b)continue;
      const gain=parent-entOf(l1,c)-entOf(n1-l1,n-c);
      if(gain>1e-12&&(!best||gain>best.gain+1e-12))best={f,s:(a+b)/2,gain,c,order,tie:false};
      else if(best&&Math.abs(gain-best.gain)<=1e-12)best.tie=true;
    }
  }
  if(!best)return null;
  return {f:best.f,s:best.s,gain:best.gain,tie:best.tie,left:best.order.slice(0,best.c),right:best.order.slice(best.c)};
}
// Best-first growth: split the leaf whose best split lowers the entropy most, up to maxLeaves.
// Node k records the step at which it was split, so the tree with L leaves is the
// state after the first L-1 steps.
function growTree(rows,idx,feats,minLeaf,maxLeaves){
  const nodes=[],steps=[];let firstTie=null;
  function mk(ix,depth,parent){const n=ix.length;let n1=0;for(const i of ix)n1+=rows[i].y;
    const nd={id:nodes.length,idx:ix,n,n1,p:n1/n,depth,parent,split:null,left:null,right:null,step:undefined,best:undefined};nodes.push(nd);return nd;}
  const root=mk(idx,0,null);root.best=bestSplit(rows,idx,feats,minLeaf);
  const frontier=[root];
  while(steps.length<maxLeaves-1){
    let pick=null;for(const nd of frontier)if(nd.best&&(!pick||nd.best.gain>pick.best.gain+1e-12))pick=nd;
    if(!pick)break;
    const b=pick.best;
    if(firstTie===null&&(b.tie||frontier.some(nd=>nd!==pick&&nd.best&&Math.abs(nd.best.gain-b.gain)<=1e-9)))firstTie=steps.length;
    pick.split={f:b.f,s:b.s,gain:b.gain};pick.step=steps.length;steps.push(pick.id);
    const L=mk(b.left,pick.depth+1,pick.id),R=mk(b.right,pick.depth+1,pick.id);
    pick.left=L.id;pick.right=R.id;L.best=bestSplit(rows,L.idx,feats,minLeaf);R.best=bestSplit(rows,R.idx,feats,minLeaf);
    frontier.splice(frontier.indexOf(pick),1);frontier.push(L,R);
  }
  return {nodes,steps,maxLeaves:steps.length+1,feats,minLeaf,firstTie};
}
function isInternal(nd,L){return nd.step!==undefined&&nd.step<L-1;}
function pathFor(tree,x,L){const path=[];let nd=tree.nodes[0];
  while(isInternal(nd,L)){const goLeft=x[nd.split.f]<=nd.split.s;path.push({node:nd,goLeft});nd=tree.nodes[goLeft?nd.left:nd.right];}
  return {path,leaf:nd};}
function leafFor(tree,x,L){return pathFor(tree,x,L).leaf;}
function leavesAt(tree,L){const out=[];(function rec(id){const nd=tree.nodes[id];if(isInternal(nd,L)){rec(nd.left);rec(nd.right);}else out.push(nd);})(0);return out;}
function scoresFor(tree,rows,L){return rows.map(r=>leafFor(tree,r.x,L).p);}
// The objective: the average over contests of -log2 of the probability given to the outcome that
// occurred, in bits per contest. The cost of one contest is capped at -log2(0.01), 6.6 bits, so that a
// held-out contest in a pure leaf of the other outcome has a finite cost.
function meanEntropy(sc,rows){let s=0;for(let i=0;i<rows.length;i++){const q=rows[i].y?sc[i]:1-sc[i];s-=Math.log2(Math.max(q,0.01));}return s/rows.length;}
function accuracy(sc,rows,t){if(t===undefined)t=0.5;let k=0;for(let i=0;i<rows.length;i++)if(((sc[i]>=t)?1:0)===rows[i].y)k++;return k/rows.length;}
function confusion(sc,rows,t){let tp=0,fp=0,fn=0,tn=0;for(let i=0;i<rows.length;i++){const f=sc[i]>=t;if(rows[i].y){f?tp++:fn++;}else{f?fp++:tn++;}}return {tp,fp,fn,tn};}
// Definition 4: the points (FPR, TPR) at the cutoffs u_0 = infinity > u_1 > ... > u_r.
function rocPoints(sc,rows){const n1=rows.reduce((a,r)=>a+r.y,0),n0=rows.length-n1;
  const levels=[...new Set(sc)].sort((a,b)=>b-a);const pts=[{fpr:0,tpr:0,t:Infinity,d:0,r:0}];let tp=0,fp=0;
  for(const u of levels){let d=0,r=0;for(let i=0;i<sc.length;i++)if(sc[i]===u){rows[i].y?d++:r++;}tp+=d;fp+=r;pts.push({fpr:fp/n0,tpr:tp/n1,t:u,d,r});}
  return pts;}
function trapezoidArea(pts){let a=0;for(let k=1;k<pts.length;k++)a+=(pts[k].fpr-pts[k-1].fpr)*(pts[k].tpr+pts[k-1].tpr)/2;return a;}
// Claim 2: the average count over positive-negative pairs (1, 1/2 or 0).
function aucOf(sc,rows){const pos=[],neg=[];for(let i=0;i<sc.length;i++)(rows[i].y?pos:neg).push(sc[i]);
  let s=0;for(const a of pos)for(const b of neg)s+=a>b?1:a===b?0.5:0;return s/(pos.length*neg.length);}
// Folds of whole election years: with the years in order, the k-th year goes to fold k mod V,
// so each fold holds every V-th election year.
function foldOf(rows,folds){const years=[...new Set(rows.map(r=>r.year))].sort((a,b)=>a-b);return rows.map(r=>years.indexOf(r.year)%folds);}
// One tree per fold, each grown on the other folds.
function cvFit(rows,feats,minLeaf,LMAX,folds){folds=folds||3;const fo=foldOf(rows,folds);const trees=[];
  for(let v=0;v<folds;v++){const tr=[];rows.forEach((r,i)=>{if(fo[i]!==v)tr.push(i);});trees.push(growTree(rows,tr,feats,minLeaf,LMAX));}
  return {fo,trees,folds};}
// Definition 5: the score of each contest from the tree grown without its fold.
function cvScores(rows,fit,L){return rows.map((r,i)=>leafFor(fit.trees[fit.fo[i]],r.x,L).p);}
// Pooled cross-validated accuracy at each number of leaves.
function cvCurve(rows,feats,minLeaf,LMAX,folds){const fit=cvFit(rows,feats,minLeaf,LMAX,folds);const out=[null];
  for(let L=1;L<=LMAX;L++)out.push(accuracy(cvScores(rows,fit,L),rows));return out;}
if(typeof module!=='undefined')module.exports={FEAT_KEYS,parseRows,entOf,meanEntropy,bestSplit,growTree,leafFor,pathFor,leavesAt,scoresFor,accuracy,confusion,rocPoints,trapezoidArea,aucOf,foldOf,cvFit,cvScores,cvCurve};

 make(stage){const size=340,m={l:50,r:16,t:16,b:46};const W=size+m.l+m.r,H=size+m.t+m.b;const xs=v=>m.l+v*size,ys=v=>m.t+(1-v)*size;
   const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'ROC curves of the cross-validated probabilities'});const strip=sv('svg',{viewBox:'0 0 680 130',role:'img','aria-label':'Past contests ordered by cross-validated probability'});
   const wrap=h('div',{class:'panel rel'});const tip=tooltip(wrap);const cm=h('div',{class:'hid'});const ctl=h('div',{class:'hid'});const stats=h('div',{class:'stats'});const rocPanel=h('div',{class:'hid'});
   const view={bars:0,cut:false,curveK:-1,area:false,deep:false};let walk=null;
   function data(){const L=S.L;const sc=cvScores(PAST,cvFitCached(),L);return {sc,pts:rocPoints(sc,PAST),area:aucOf(sc,PAST)};}
   function draw(){const L=S.L;const {sc,pts,area}=data();const deep=cvScores(PAST,cvFitCached(),Lcap()),dpts=rocPoints(deep,PAST);
     svg.replaceChildren();for(const v of [0.2,0.4,0.6,0.8])svg.append(sv('line',{x1:xs(v),x2:xs(v),y1:m.t,y2:m.t+size,stroke:css('--grid')}),sv('line',{x1:m.l,x2:m.l+size,y1:ys(v),y2:ys(v),stroke:css('--grid')}));
     for(const v of [0,0.5,1])svg.append(sv('text',{x:xs(v),y:H-m.b+18,'text-anchor':'middle','font-size':13},v),sv('text',{x:m.l-8,y:ys(v)+4,'text-anchor':'end','font-size':13},v));
     svg.append(sv('rect',{x:m.l,y:m.t,width:size,height:size,fill:'none',stroke:css('--line')}),sv('line',{x1:xs(0),y1:ys(0),x2:xs(1),y2:ys(1),stroke:css('--muted'),'stroke-dasharray':'3 4'}));
     svg.append(sv('text',{x:m.l+size/2,y:H-6,'text-anchor':'middle','font-size':13},'false positive rate: fraction of Republican wins with ŷ = 1'),sv('text',{x:14,y:m.t+size/2,'font-size':13,transform:`rotate(-90 14 ${m.t+size/2})`,'text-anchor':'middle'},'true positive rate: fraction of Democratic wins with ŷ = 1'));
     const upto=view.curveK<0?pts.length:Math.min(pts.length,view.curveK+1);const shown=pts.slice(0,upto);
     if(view.area&&upto===pts.length)svg.append(sv('path',{d:pts.map((q,i)=>(i?'L':'M')+xs(q.fpr)+' '+ys(q.tpr)).join('')+`L${xs(1)} ${ys(0)}Z`,fill:css('--valid'),opacity:.18}));
     if(view.deep)svg.append(sv('path',{d:dpts.map((q,i)=>(i?'L':'M')+xs(q.fpr)+' '+ys(q.tpr)).join(''),fill:'none',stroke:css('--muted'),'stroke-width':1.5,'stroke-dasharray':'6 4'}));
     if(shown.length>1)svg.append(sv('path',{d:shown.map((q,i)=>(i?'L':'M')+xs(q.fpr)+' '+ys(q.tpr)).join(''),fill:'none',stroke:css('--valid'),'stroke-width':3.2}));
     shown.forEach((q,k)=>svg.append(sv('circle',{cx:xs(q.fpr),cy:ys(q.tpr),r:4.5,fill:css('--valid'),stroke:css('--bg'),'stroke-width':1.5,style:'cursor:pointer',onclick:()=>{S.cutoff=q.t===Infinity?1.01:q.t;draw();},onmousemove:ev=>tip.show(`cutoff ${q.t===Infinity?'above every probability':'t = '+fmt(q.t,2)}<br>true positive rate ${fmt(q.tpr,2)}, false positive rate ${fmt(q.fpr,2)}${k?`<br>this step adds ${q.d} Democratic and ${q.r} Republican wins`:''}`,ev),onmouseleave:()=>tip.hide()})));
     const cf=confusion(sc,PAST,S.cutoff);const n1=cf.tp+cf.fn,n0=cf.fp+cf.tn;if(view.cut)svg.append(sv('circle',{cx:xs(cf.fp/n0),cy:ys(cf.tp/n1),r:9,fill:'none',stroke:css('--hilite'),'stroke-width':3}));
     if(view.deep)svg.append(sv('text',{x:xs(1)-4,y:ys(0)-8,'text-anchor':'end','font-size':13,style:'fill:'+css('--muted')},`dashed: ${Lcap()} leaves`));
     strip.replaceChildren();const order=PAST.map((r,i)=>i).sort((a,b)=>sc[b]-sc[a]||PAST[b].y-PAST[a].y);const X0=58,bw=610/order.length,Y0=102;
     strip.append(sv('line',{x1:X0-4,x2:X0-4,y1:Y0-90,y2:Y0,stroke:css('--line')}),sv('text',{x:X0-8,y:Y0+4,'text-anchor':'end','font-size':11},'0'),sv('text',{x:X0-8,y:Y0-90+4,'text-anchor':'end','font-size':11},'1'),sv('text',{x:12,y:Y0-45,transform:`rotate(-90 12 ${Y0-45})`,'text-anchor':'middle','font-size':11},'predicted probability'));
     order.forEach((i,k)=>{const r=PAST[i];const hgt=2+sc[i]*88;const active=!view.cut||sc[i]>=S.cutoff;const vis=k<view.bars;strip.append(sv('rect',{x:X0+k*bw,y:Y0-hgt,width:Math.max(1,bw-0.6),height:hgt,fill:party(r.y),opacity:vis?(active?.95:.28):0,onmousemove:ev=>tip.show(`<b>${r.state} ${r.year}</b>. The ${r.y?'Democrat':'Republican'} won.<br>Predicted probability of a Democratic win: ${pct(sc[i],0)}.`,ev),onmouseleave:()=>tip.hide()}));});
     if(view.cut){const cutX=X0+order.filter(i=>sc[i]>=S.cutoff).length*bw;strip.append(sv('line',{x1:cutX,x2:cutX,y1:6,y2:Y0+2,stroke:css('--hilite'),'stroke-width':2.5,'stroke-dasharray':'6 3'}),sv('text',{x:cutX+4,y:14,'font-size':12,style:'fill:'+css('--hilite')},'ŷ = 1 ← | → ŷ = 0'));}
     strip.append(sv('text',{x:X0+305,y:Y0+20,'text-anchor':'middle','font-size':12},'the 733 past contests, ordered by cross-validated probability of a Democratic win, highest first'));
     cm.replaceChildren(h('table',{class:'cm'},h('tr',{},h('td',{}),h('th',{},'Democrat won'),h('th',{},'Republican won')),h('tr',{},h('th',{},'ŷ = 1'),h('td',{},cf.tp+' true positives'),h('td',{},cf.fp+' false positives')),h('tr',{},h('th',{},'ŷ = 0'),h('td',{},cf.fn+' false negatives'),h('td',{},cf.tn+' true negatives'))));
     stats.replaceChildren(...[view.cut?h('div',{class:'stat'},h('span',{class:'v'},S.cutoff>1?'none':fmt(S.cutoff,2)),h('span',{class:'l'},'cutoff t')):null,view.cut?h('div',{class:'stat'},h('span',{class:'v'},fmt(cf.tp/n1,2)),h('span',{class:'l'},'true positive rate')):null,view.cut?h('div',{class:'stat'},h('span',{class:'v'},fmt(cf.fp/n0,2)),h('span',{class:'l'},'false positive rate')):null,
       view.area?h('div',{class:'stat'},h('span',{class:'v',style:'color:'+css('--valid')},fmt(area,3)),h('span',{class:'l'},`area under the curve, ${L} ${L===1?'leaf':'leaves'}`)):null,view.deep?h('div',{class:'stat'},h('span',{class:'v',style:'color:'+css('--muted')},fmt(aucOf(deep,PAST),3)),h('span',{class:'l'},`area, ${Lcap()} leaves`)):null].filter(Boolean));}
   function doWalk(inst,done){const {pts}=data();if(inst||reduced){view.curveK=-1;S.cutoff=0.5;draw();done&&done();return;}let k=0;view.curveK=0;S.cutoff=1.01;draw();
     walk=setInterval(()=>{k++;if(k>=pts.length){clearInterval(walk);walk=null;view.curveK=-1;S.cutoff=0.5;draw();done&&done();return;}S.cutoff=pts[k].t;view.curveK=k;const c=$('#cut');if(c)c.value=Math.min(S.cutoff,1.01);draw();},650);TIMERS.push(walk);}
   function rebuild(full){if(full)ctl.replaceChildren(treeControls(rebuild,h('span',{style:'display:inline-flex;gap:14px;align-items:center'},h('label',{for:'cut'},'Cutoff t'),h('input',{type:'range',min:0,max:1.01,step:0.01,value:Math.min(S.cutoff,1.01),id:'cut',oninput:e=>{S.cutoff=+e.target.value;draw();}}),h('button',{class:'btn',onclick:()=>{if(walk){clearInterval(walk);walk=null;view.curveK=-1;draw();return;}doWalk(false);}},'Replay the curve'))));draw();}
   const grid=h('div',{style:'display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start'},rocPanel,h('div',{},stats,h('div',{style:'height:12px'}),cm));rocPanel.append(svg);
   wrap.append(h('h3',{},'Cross-validated probabilities on the 733 past contests'),ctl,strip,grid);stage.append(wrap);
   const obs=new ResizeObserver(()=>{grid.style.gridTemplateColumns=grid.clientWidth<640?'1fr':'minmax(0,1fr) minmax(0,1fr)';});obs.observe(grid);
   S.cutoff=0.5;view.bars=0;draw();
   return {beats:[
    {bullet:0,run(inst){anim(1600,t=>{view.bars=Math.round(PAST.length*t);draw();},null,inst);}},
    {bullet:1,run(inst){view.bars=PAST.length;view.cut=true;show(cm,inst);const {pts}=data();if(inst||reduced){S.cutoff=0.5;draw();return;}let k=0;S.cutoff=1.01;draw();const step=()=>{k++;if(k>=pts.length||pts[k].t<0.5){S.cutoff=0.5;draw();return;}S.cutoff=pts[k].t;draw();later(step,900);};later(step,800);}},
    {bullet:2,run(inst){view.cut=true;show(rocPanel,inst);doWalk(inst);}},
    {bullet:3,run(inst){view.curveK=-1;view.area=true;draw();}},
    {bullet:4,run(inst){view.deep=true;show(ctl,inst);rebuild(true);}}]};}}
];

// ----- sizing: a click selects a panel or the narration; the bar or the keys - + 0 resize it ----------
// Sizes are kept per scene and per element in this browser.
let ZOOM={};try{const z=JSON.parse(localStorage.getItem('senate-zoom')||'{}');if(z&&typeof z==='object')ZOOM=z;}catch(e){}
let SEL=null;
function zoomKey(el){const sc=SCENES[S.scene].id;if(el.classList.contains('story'))return sc+':story';return sc+':p'+[...document.querySelectorAll('#scene .stage .panel')].indexOf(el);}
function applyZoom(){document.querySelectorAll('#scene .story,#scene .stage .panel').forEach(el=>{const k=ZOOM[zoomKey(el)];el.style.zoom=k&&k!==1?k:'';});}
function zbar(el){document.querySelectorAll('.zbar').forEach(b=>b.remove());if(!el)return;const k=ZOOM[zoomKey(el)]||1;
  el.append(h('div',{class:'zbar',style:'zoom:'+(1/k)},h('button',{title:'Smaller (key −)',onclick:e=>{e.stopPropagation();resize(1/1.1);}},'−'),h('span',{},Math.round(k*100)+'%'),
    h('button',{title:'Larger (key +)',onclick:e=>{e.stopPropagation();resize(1.1);}},'+'),h('button',{title:'Original size (key 0)',onclick:e=>{e.stopPropagation();resize(0);}},'reset')));}
function select(el){if(SEL)SEL.classList.remove('zsel');SEL=el;if(el)el.classList.add('zsel');zbar(el);}
function resize(f){if(!SEL||!SEL.isConnected)return;const key=zoomKey(SEL);let k=f===0?1:Math.min(3,Math.max(0.5,(ZOOM[key]||1)*f));k=Math.round(k*100)/100;
  if(k===1)delete ZOOM[key];else ZOOM[key]=k;try{localStorage.setItem('senate-zoom',JSON.stringify(ZOOM));}catch(e){}applyZoom();zbar(SEL);fit();}
$('#scene').addEventListener('click',e=>{if(e.target.closest('.zbar'))return;const el=e.target.closest('.stage .panel,.story');if(el!==SEL)select(el||null);});

// ----- the beat engine ---------------------------------------------------------------------------
let CTX=null;
// The page is a slide: when a scene is taller than the space under the top bar, it is scaled down to fit, so the presentation never needs a scroll bar. Phones scroll instead.
function fit(){const scene=$('#scene'),main=$('main');if(!scene||!main)return;if(window.innerWidth<=960){scene.style.transform='';scene.style.width='';return;}
  scene.style.transform='';scene.style.width='';const avail=main.clientHeight-16;const need=scene.scrollHeight;
  if(need>avail){const k=Math.max(0.55,avail/need);scene.style.transform=`scale(${k})`;}}
const fitObserver=new ResizeObserver(()=>fit());window.addEventListener('resize',fit);
function render(animate){clearTimers();const sc=SCENES[S.scene];const story=h('div',{class:'story'},sc.id==='today'?h('p',{class:'kicker'},sc.kicker):null,h('h2',{},sc.title),h('ol',{},sc.bullets.map(t=>h('li',{html:t}))),h('div',{class:'note',html:sc.note}));
  const stage=h('div',{class:'stage'});$('#scene').replaceChildren(story,stage);fitObserver.disconnect();fitObserver.observe(stage);fitObserver.observe(story);
  CTX=sc.make(stage);const beats=CTX.beats;S.beat=Math.max(0,Math.min(beats.length-1,S.beat));
  for(let k=0;k<S.beat;k++)beats[k].run(true);
  beats[S.beat].run(!animate);
  SEL=null;applyZoom();
  const lis=story.querySelectorAll('ol>li');beats.forEach((b,k)=>{if(k<=S.beat&&b.bullet!==undefined){lis[b.bullet].classList.add('on');if(b.q)lis[b.bullet].classList.add('q');}});
  beats.forEach((b,k)=>{if(k<=S.beat&&b.sub!==undefined){const sl=lis[b.bullet].querySelectorAll('ul.sub>li')[b.sub];if(sl){sl.classList.add('on');if(k===S.beat)sl.classList.add('now');}}});
  if(S.beat===beats.length-1)story.querySelector('.note').classList.add('on');
  $('#chips').replaceChildren(...SCENES.map((s,i)=>h('button',{class:'chip'+(i===S.scene?' on':''),onclick:()=>{S.scene=i;S.beat=0;render(true);},'aria-current':i===S.scene?'step':null},h('b',{},i+1),s.chip)));
  $('#beats').replaceChildren(...beats.map((b,k)=>h('i',{class:k<S.beat?'done':k===S.beat?'now':''})));
  $('#where').textContent=`Scene ${S.scene+1} of ${SCENES.length} · step ${S.beat+1} of ${beats.length}`;
  const total=SCENES.reduce((a,s)=>a+1,0);$('#prog').style.width=(100*(S.scene+(S.beat+1)/beats.length)/total)+'%';
  $('#prev').disabled=S.scene===0&&S.beat===0;$('#next').textContent=S.beat<beats.length-1?'Next step →':(S.scene<SCENES.length-1?'Next scene →':'Done');$('#next').disabled=S.scene===SCENES.length-1&&S.beat===beats.length-1;
  const hash='#'+sc.id+(S.beat?'-'+S.beat:'');if(location.hash!==hash)history.replaceState(null,'',hash);try{localStorage.setItem('senate-scene',hash);}catch(e){}fit();later(fit,700,false);later(fit,1800,false);}
function next(){if(S.beat<CTX.beats.length-1){S.beat++;render(true);}else if(S.scene<SCENES.length-1){S.scene++;S.beat=0;render(true);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});}}
function prev(){if(S.beat>0){S.beat--;render(false);}else if(S.scene>0){S.scene--;S.beat=0;render(false);}}
$('#prev').addEventListener('click',prev);$('#next').addEventListener('click',next);
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;
  if(SEL&&(e.key==='+'||e.key==='=')){e.preventDefault();resize(1.1);return;}if(SEL&&(e.key==='-'||e.key==='_')){e.preventDefault();resize(1/1.1);return;}if(SEL&&e.key==='0'){e.preventDefault();resize(0);return;}if(e.key==='Escape'){select(null);return;}
 if(e.key===' '&&e.target.matches('button'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}if(e.key==='ArrowLeft'){e.preventDefault();prev();}});
function fromHash(){const m=location.hash.replace('#','').match(/^([a-z-]+?)(?:-(\d+))?$/);if(!m)return false;const i=SCENES.findIndex(s=>s.id===m[1]);if(i<0)return false;S.scene=i;S.beat=m[2]?+m[2]:0;return true;}
window.addEventListener('hashchange',()=>{if(fromHash())render(false);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(false));
function themeLabel(){$('#theme').textContent=document.documentElement.getAttribute('data-theme')==='light'?'Dark stage':'Light page';}
$('#theme').addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');const next=cur==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('senate-theme',next);}catch(e){}themeLabel();render(false);});
function start(saved){if(saved&&typeof saved==='object')Object.assign(S,saved);try{const t=localStorage.getItem('senate-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}themeLabel();if(!fromHash()){let last=null;try{last=localStorage.getItem('senate-scene');}catch(e){}if(last){location.hash=last;fromHash();}}render(false);}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({L:S.L,minLeaf:S.minLeaf,feats:S.feats,cutoff:S.cutoff,cv:S.cv,picked:S.picked}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
