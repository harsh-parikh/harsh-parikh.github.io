name: Capture job submission

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: job-board-writes
  cancel-in-progress: false

jobs:
  capture:
    if: startsWith(github.event.issue.title, '[Job submission]:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add submission to review queue
        run: python3 scripts/capture_job_submission.py --event "$GITHUB_EVENT_PATH"
      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job_submissions.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Queue job suggestion #${{ github.event.issue.number }}"
          git push
