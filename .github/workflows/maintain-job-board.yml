name: Maintain job board

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-board-writes
  cancel-in-progress: false

jobs:
  remove-expired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove expired rows and rebuild the static board
        run: |
          python3 scripts/prune_expired_jobs.py
          python3 scripts/build_jobs.py
          python3 scripts/validate_jobs.py
      - name: Publish maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/job_submissions.csv jobs.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove expired job listings"
          git push
